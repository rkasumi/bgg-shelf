name: GHCR Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-sync-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: image
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./jobs/sync/Dockerfile
          push: true
          tags: |
            ghcr.io/rkasumi/bgg-shelf:latest
            ghcr.io/rkasumi/bgg-shelf:sha-${{ steps.image.outputs.short_sha }}
      - name: Write image summary
        run: echo "image digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the published runtime image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --pull always --network none --read-only \
            --entrypoint node "ghcr.io/rkasumi/bgg-shelf@$IMAGE_DIGEST" \
            -e 'const assert = require("node:assert/strict"); assert.equal(process.version, "v24.22.1"); console.log(JSON.stringify({node: process.version, brotli: process.versions.brotli, openssl: process.versions.openssl}));' > runtime-check.json
          cat runtime-check.json
      - name: Write release image metadata
        if: github.event_name != 'pull_request'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_REF: ghcr.io/rkasumi/bgg-shelf:sha-${{ steps.image.outputs.short_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '{"sourceCommit":"%s","image":"%s","digest":"%s"}\n' \
            "$SOURCE_COMMIT" "$IMAGE_REF" "$IMAGE_DIGEST" > release-image.json
      - name: Upload release image metadata
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: |
            release-image.json
            runtime-check.json
          if-no-files-found: error
